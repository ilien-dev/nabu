<!--palette
bg          #161616 #F2F1EC
panel       #202020 #FFFFFF
line        #2C2C2C #DEDCD4
edge        #3A3A3A #CFCDC4
ink         #F2F1EC #161616
body        #BDBDB8 #3A3A38
muted       #8A8A85 #6B6A64
