<text id="name" x="128" y="134" class="b" font-size="40" fill="$ink">nabu</text>
<text id="tagline" class="b" font-size="48" fill="$ink"><tspan x="64" y="242">Set it up once.</tspan><tspan x="64" y="300" fill="$accent_text">Then just review.</tspan></text>
<text id="about" class="s" font-size="20" fill="$body"><tspan x="64" y="350">An agent skill that gives any GitHub repo branch</tspan><tspan x="64" y="378">rules, a PR format, checks and automatic releases.</tspan></text>
<g id="facts"><defs><clipPath id="feat"><rect x="60" y="416" width="500" height="44"/></clipPath></defs><g clip-path="url(#feat)">
<g class="turn" opacity="0" style="animation-delay:-7.5s"><rect x="66" y="432" width="12" height="12" rx="2" fill="$accent"/><text x="92" y="445" class="s" font-size="20" fill="$ink">One command to set up</text></g>
<g class="turn" opacity="0" style="animation-delay:-5s"><rect x="66" y="432" width="12" height="12" rx="2" fill="$accent"/><text x="92" y="445" class="s" font-size="20" fill="$ink">Every pull request checked</text></g>
<g class="turn" opacity="0" style="animation-delay:-2.5s"><rect x="66" y="432" width="12" height="12" rx="2" fill="$accent"/><text x="92" y="445" class="s" font-size="20" fill="$ink">Versions nobody writes</text></g>
<g class="turn" style="animation-delay:-0s"><rect x="66" y="432" width="12" height="12" rx="2" fill="$accent"/><text x="92" y="445" class="s" font-size="20" fill="$ink">Works in any language</text></g>
</g></g>
