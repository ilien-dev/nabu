<!--brief
sentence: A maintainer whose project is already on GitHub runs one command, answers three questions, and from then on only reviews pull requests: branch names, PR descriptions, checks, versions and releases take care of themselves.
input: a repository with only its code (any GitHub repo) -> /nabu:setup (skills/setup/SKILL.md, skills/nabu/scripts/nabu.mjs)
output: CONTRIBUTING.md, .github/pull_request_template.md, .github/workflows/pr-rules.yml, .github/workflows/release.yml (skills/nabu/assets/), ruleset protecting main (nabu.mjs github), releases by release-please (skills/nabu/references/versioning.md)
features: One command to set up (skills/setup/SKILL.md) · Every PR checked (assets/github/scripts/check-pr.cjs) · Versions nobody writes (references/versioning.md) · Any language (README, SKILL.md description)
left out: nothing is marked unfinished in the repo
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="A plain repository called my-project goes into the Nabu box after typing /nabu:setup, and comes out with CONTRIBUTING.md, a PR template, a PR rules workflow, a release workflow, a protected main branch and a v1.0.0 release, while contributors send pull requests into it.">
<style>
/* 10 s story
   type     |-type-|=================================================|back|
   parcel1         |--in to box--|
   lid                       |-lift-|
   parcel2                         |--out--|
   rows                                    |r1|r2|r3|r4|
   chip-main                                          |on|
   termout                                            |shown........|out|
   pr1/pr2                                                  |up|  |up|
   tag                                                               |pop|
   reset                                                                  |dim| */
@keyframes type{0%,2%{transform:translateX(-125px);animation-timing-function:steps(13,end)}9%,95%{transform:translateX(0);animation-timing-function:steps(13,end)}100%{transform:translateX(-125px)}}
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}
@keyframes p1{0%,9%{transform:translate(0,0);opacity:0}10%{opacity:1}14%{transform:translate(0,44px)}20%{transform:translate(84px,44px);opacity:1}22%,100%{transform:translate(84px,44px);opacity:0}}
@keyframes lid{0%,20%{transform:translateY(0)}23%,27%{transform:translateY(-12px)}30%,100%{transform:translateY(0)}}
@keyframes mouth{0%,27%{opacity:1}29%,31%{opacity:.555}34%,100%{opacity:1}}
@keyframes p2{0%,29%{transform:translateX(0);opacity:0}30%{opacity:1}37%{transform:translateX(46px);opacity:1}39%,100%{transform:translateX(46px);opacity:0}}
@keyframes row{0%{opacity:1}4%,92%{opacity:1}96%,100%{opacity:.55}}
@keyframes rowin{0%,1%{opacity:.55}4%,96%{opacity:1}100%{opacity:.55}}
@keyframes out{0%,56%{opacity:0}59%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes up{0%{transform:translateY(0);opacity:0}2%{opacity:1}11%{transform:translateY(-92px);opacity:1}13%,100%{transform:translateY(-92px);opacity:0}}
@keyframes pop{0%,81%{opacity:.55;transform:scale(.92)}85%,95%{opacity:1;transform:scale(1)}99%,100%{opacity:.55;transform:scale(.92)}}
@keyframes turn{0%{transform:translateY(32px);opacity:0}4%,25%{transform:translateY(0);opacity:1}29%,100%{transform:translateY(-32px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
.type{animation:type 10s linear infinite}
.caret{animation:caret 1.1s steps(1,end) infinite}
.p1{animation:p1 10s cubic-bezier(.4,0,.2,1) infinite}
.lid{animation:lid 10s cubic-bezier(.4,0,.2,1) infinite}
.mouth{animation:mouth 10s ease-in-out infinite}
.p2{animation:p2 10s cubic-bezier(.4,0,.2,1) infinite}
.row{animation:rowin 10s cubic-bezier(0,0,.2,1) infinite}
.out{animation:out 10s ease-out infinite}
.up{animation:up 10s cubic-bezier(.4,0,.2,1) infinite}
.pop{animation:pop 10s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
.turn{animation:turn 10s cubic-bezier(.4,0,.2,1) infinite}
.flow{animation:flow 1.2s linear infinite}
</style>
<rect width="1280" height="640" fill="$bg"/>
<g id="backdrop" data-backdrop="grid still"><defs><pattern id="bd-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40M0 0V40" fill="none" stroke="$line" stroke-width="1"/></pattern></defs><rect x="-40" y="-40" width="1360" height="720" fill="url(#bd-grid)"/></g>
