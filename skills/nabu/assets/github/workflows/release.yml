name: Release

# Nobody writes a version number and nobody cuts a release by hand. On every push to
# {{defaultBranch}}, release-please reads the commits since the last release (each one the title of
# a squash-merged pull request) and opens or updates "chore({{defaultBranch}}): release X.Y.Z" with the
# next version in every file of release-please-config.json and the new section of
# CHANGELOG.md. This workflow merges that pull request at once and runs release-please again,
# which creates the tag and the GitHub Release as a draft. The jobs that attach files or
# publish elsewhere run from that tag, and only when all of them succeed does "publish" make
# the Release public and latest: nobody sees, downloads or updates to a release that is not
# complete. A failed job leaves the draft: "Re-run failed jobs" on that same run finishes it.
# A new run releases nothing for that version; to drop it, delete the draft and its tag.
# {{releaseSummary}}
#
# Everything runs with RELEASE_TOKEN, a fine-grained token of a repository admin (Contents
# and Pull requests: read and write). With the default token the release pull request is
# opened by a bot whose checks wait for approval and which cannot merge past the ruleset; the
# admin token opens it like a person does and merges it with --admin, which the ruleset lets
# admins do. token-check.yml warns before it expires.
# Managed by Nabu (https://github.com/ilien-dev/nabu); do not edit by hand.

on:
  push:
    branches: [{{defaultBranch}}]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.publish.outputs.release_created }}
      tag: ${{ steps.publish.outputs.tag_name }}
      version: ${{ steps.publish.outputs.version }}
    steps:
{{#sync}}
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

{{/sync}}
      - name: Open or update the release pull request
        id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Merge the release pull request
        id: merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          RP_PR: ${{ steps.rp.outputs.pr }}
        run: |
          # The PR release-please just opened or updated. Its label can take a few seconds to
          # be searchable, so the label lookup is only a fallback, retried.
          pr=$(printf '%s' "$RP_PR" | jq -r '.number // empty' 2>/dev/null || true)
          for attempt in 1 2 3 4 5 6; do
            [ -n "$pr" ] && break
            pr=$(gh pr list --repo "$REPO" --state open --label "autorelease: pending" --json number --jq '.[0].number')
            [ -n "$pr" ] || sleep 5
          done
          if [ -z "$pr" ]; then
            echo "Nothing to release."
            exit 0
          fi
          match=""
{{#sync}}
          # release-please writes the version only where release-please-config.json says; the
          # project's sync commands write it everywhere else, on the release branch itself.
          branch=$(gh pr view "$pr" --repo "$REPO" --json headRefName --jq .headRefName)
          git fetch origin "$branch"
          git checkout -B "$branch" FETCH_HEAD
{{syncSteps}}
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "chore: write the version into every file that repeats it"
            git push origin "HEAD:$branch"
          fi
          match="--match-head-commit $(git rev-parse HEAD)"
{{/sync}}
          gh pr merge "$pr" --repo "$REPO" --squash --admin --delete-branch $match
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Publish the tag and the GitHub Release
        id: publish
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
{{#build}}

  # Builds each target from the release tag and attaches what it produces to the Release.
  # VERSION is the released version; VERSION_CODE is the same version as one integer
  # (major * 1000000 + minor * 1000 + patch), for stores that want a number that only grows.
  build:
    name: Build (${{ matrix.name }})
    needs: release
    if: needs.release.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
{{buildMatrix}}
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Version code
        shell: bash
        run: |
          IFS=. read -r major minor patch <<< "${VERSION%%-*}"
          echo "VERSION_CODE=$(( major * 1000000 + minor * 1000 + patch ))" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
{{buildSecrets}}
        run: ${{ matrix.run }}

      - name: Attach to the Release
        shell: bash
        run: gh release upload "$TAG" ${{ matrix.artifacts }} --clobber
{{/build}}
{{#npm}}

  # Publishes to npm with trusted publishing: npmjs.com trusts this workflow through OIDC, so
  # no npm token is stored, and the package carries a provenance statement.
  npm:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5 or later.
      - run: npm install -g npm@latest
{{npmPrepare}}
      - run: npm publish --provenance --access public
{{/npm}}
{{#beforePublish}}

  # The project's own workflow, run from the tag while the Release is still a draft: what it
  # attaches is there before anyone can see the Release. It receives the tag and the version.
  before-publish:
    name: Before publishing
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
{{beforePublishPermissions}}
    uses: ./{{beforePublishWorkflow}}
    with:
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
{{/beforePublish}}

  # Makes the draft public and latest once every job above has succeeded.
  publish:
    name: Publish the Release
    needs: [{{publishNeeds}}]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
{{#finish}}
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      # The project's last steps, run with every file already attached to the draft.
{{finishSteps}}

{{/finish}}
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
{{#afterPublish}}

  # The project's own workflow for what needs the Release public first: package managers and
  # registries that download its files. A failure here leaves the Release public; re-run it.
  after-publish:
    name: After publishing
    needs: [release, publish]
    if: needs.release.outputs.created == 'true'
    permissions:
{{afterPublishPermissions}}
    uses: ./{{afterPublishWorkflow}}
    with:
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
{{/afterPublish}}
